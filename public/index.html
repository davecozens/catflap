<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg">
<title>Home</title>
<style>
:root { --bg: #f6f4ef; --panel: #fff; --ink: #1c1f1d; --muted: #6b716d; --line: #e5e2da; --chip: #efece4; --ok: #1f8a5b; --off: #a7aba8; --accent: #1f6b5c; }
@media (prefers-color-scheme: dark) { :root { --bg: #121614; --panel: #1b201e; --ink: #e8ebe9; --muted: #98a09b; --line: #2a302d; --chip: #252b28; --ok: #4cc38a; --off: #5d6461; --accent: #5cc3a9; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
header img { width: 34px; height: 34px; }
h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 14px; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 26px 2px 10px; font-weight: 650; }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); }
a.tile, div.tile { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; color: inherit; text-decoration: none; min-height: 104px; }
a.tile:hover { border-color: var(--accent); }
.tile .top { display: flex; align-items: center; gap: 8px; }
.tile b { font-size: 16px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--off); flex: none; }
.dot.on { background: var(--ok); }
.tile p { margin: 4px 0 8px; color: var(--muted); font-size: 13.5px; }
.tile .addr { font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--accent); }
.tile.off { opacity: .6; }
.badge { font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
td { padding: 8px 12px; border-top: 1px solid var(--line); }
tr:first-child td { border-top: 0; }
td.port { font: 13px ui-monospace, "SF Mono", Menlo, monospace; width: 80px; }
</style>
</head>
<body>
<div class="wrap">
  <header><img src="icon.svg" alt=""><h1>Home</h1></header>
  <div class="sub" id="sub">Everything running on the Mac, by name.</div>
  <h2>Open from any device at home</h2>
  <div class="tiles" id="lan"></div>
  <div id="macOnlyWrap"><h2>On the Mac only</h2><div class="tiles" id="mac"></div></div>
  <div id="otherWrap" hidden><h2>Also listening on this Mac</h2><table id="other"></table></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function load() {
  const d = await (await fetch('/api/directory')).json();
  const tile = (s, link) => {
    const inner = `<div class="top"><span class="dot ${s.running ? 'on' : ''}"></span><b>${esc(s.title)}</b>${s.lan ? '' : '<span class="badge">MAC ONLY</span>'}</div>
      <p>${esc(s.description ?? '')}${s.running ? '' : ' · not running'}</p><div class="addr">${esc(s.name)}.local${d.fromMac ? ` · :${s.port}` : ''}</div>`;
    return link && s.running ? `<a class="tile" href="${esc(s.url)}">${inner}</a>` : `<div class="tile ${s.running ? '' : 'off'}">${inner}</div>`;
  };
  const lan = d.services.filter((s) => s.lan);
  const mac = d.services.filter((s) => !s.lan);
  $('lan').innerHTML = lan.map((s) => tile(s, true)).join('') || '<p class="sub">Nothing shared with the house yet.</p>';
  // From other devices these can't be opened, so show them without links.
  $('mac').innerHTML = mac.map((s) => tile(s, d.fromMac)).join('');
  $('macOnlyWrap').hidden = !mac.length;
  $('sub').textContent = d.fromMac ? 'You are on the Mac: everything here opens. Other devices see the first group.' : 'Everything running on the Mac, by name.';
  $('otherWrap').hidden = !d.other.length;
  $('other').innerHTML = d.other.map((o) => `<tr><td class="port">${o.port}</td><td>${esc(o.process)}</td><td class="sub">${o.localOnly ? 'this Mac only' : 'reachable from the network'}</td></tr>`).join('');
}
load();
setInterval(load, 15000);
</script>
</body>
</html>
